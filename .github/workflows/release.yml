name: Releases

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_pr:
        description: 'Trigger the `pr` job'
        required: true
        type: boolean
      run_release:
        description: 'Trigger the `release` job'
        required: true
        type: boolean

jobs:
  pr:
    name: Create PR (if applicable)
    runs-on: ubuntu-latest
    if: inputs.run_pr != 'false'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      created: ${{ steps.pr.outputs.prs_created }}
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - &install-semver-checks
        name: Install semver-checks
        uses: taiki-e/install-action@cargo-semver-checks
      - id: pr
        name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: "${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}"

  # Used to indicate that a PR was created in the GitHub checks list UI
  pr_confirm:
    name: Create PR
    runs-on: ubuntu-latest
    needs:
      - pr
    if: needs.pr.outputs.created == 'true'
    steps:
      - name: PR created confirmation
        run: echo "PR created"

  release:
    name: Publish (if applicable)
    runs-on: ubuntu-latest
    if: inputs.run_release != 'false'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
    steps:
      - *checkout
      - *install-rust
      - *install-semver-checks
      - id: release
        name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: "${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}"

  # Used to indicate that releases were created in the GitHub checks list UI
  release_confirm:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - release
    if: needs.release.outputs.created == 'true'
    steps:
      - name: Publish confirmation
        run: echo "Releases created"
