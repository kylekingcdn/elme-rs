[package]
name = "elme"
description = "Framework of common glue code for Rust binaries"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
#default = ["config", "db", "db-op-traits"]
## Enables the `elme-config` module
config = ["dep:elme-config"]
## Enables the `elme-db` module
db = ["dep:elme-db"]
## Enables the `op-traits` feature of the `db` module
db-op-traits = ["db", "elme-db/op-traits"]

[dependencies]
elme-config = { version = "0.0.2", path = "../elme-config", optional = true }
elme-db = { version = "0.0.2", path = "../elme-db", optional = true }
