[package]
name = "elme-shutdown"
description = "elme module - graceful shutdown/reload, task tracking, and more"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "elme_shutdown"

[[example]]
name = "basic"

[lints]
workspace = true

[features]
default = [
    "serde"
]
## enables all features
full = [
    "progress",
    "progress-writer",
    "serde",
]
## show lifecycle and task teardown progress
progress = ["dep:indicatif"]
## provides tracing-subscriber writer for proper tracing output
progress-writer = ["progress", "tracing-subscriber/fmt", "tracing-subscriber/std"]
serde = ["dep:serde", "lib-conf/serde"]

[dependencies]
chrono = { workspace = true, features = ["clock", "now"] }
console = { workspace = true, features = ["default"] }
indicatif = { workspace = true, optional = true }
lib-conf = { workspace = true, features = ["derive", "adapter-tracing-level"] }
serde = { workspace = true, optional = true, features = ["std", "derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["tracing"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
async-channel = { workspace = true }
color-eyre = { workspace = true }
indicatif = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["default", "env-filter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
